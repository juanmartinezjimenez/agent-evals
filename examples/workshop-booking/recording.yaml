# Recorded final answers for suite.yaml, keyed by case id.
# Only the answer to the last user turn is recorded; earlier turns live in the suite.
# One answer is deliberately wrong: it confirms a slot that does not exist.
# Format 2: each case stores a fingerprint of its system prompt and input (ADR 0007).
version: 2
cases:
  confirm-chosen-slot:
    fingerprint: sha256:9459232ed723c7db
    output: You're booked for Thursday at 17:30, Laura Pérez. See you then!
  correction-wins:
    fingerprint: sha256:263a2c74de19d3a3
    output: No problem, Marc. Your booking is now Thursday at 17:30.
  no-invented-slot:
    fingerprint: sha256:83e7648bf263c3a5
    output: Sure, you're booked for Saturday at 11:00.
  total-from-earlier-price:
    fingerprint: sha256:ff3ff1ef43847360
    output: A brake service plus a chain replacement comes to 55 euros.
  cancel-keeps-name:
    fingerprint: sha256:f3e18242b5e7f573
    output: Done, Marc. I've cancelled your Thursday 17:30 booking.
  opening-hours:
    fingerprint: sha256:b223d9dd0f6f21fe
    output: On Saturdays we open at 9:00 and close at 18:00.
