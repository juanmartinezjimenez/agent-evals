# Recorded outputs after a hypothetical prompt change, keyed by case id.
# Compared with recording.yaml it fixes refund-damaged but breaks wrong-address,
# so the pass rate stays at 9/10 and only `agent-evals compare` shows the regression.
# Format 2: each case stores a fingerprint of its system prompt and input (ADR 0007).
version: 2
cases:
  double-charge:
    fingerprint: sha256:3ca205692ed0b6d2
    output: billing
  invoice-copy:
    fingerprint: sha256:a73d0a6ad36e5547
    output: Billing
  app-crash:
    fingerprint: sha256:15d577bef2d82ea6
    output: technical
  sync-error:
    fingerprint: sha256:77a71973c0ada1fd
    output: technical
  password-reset:
    fingerprint: sha256:9b8fe057e80a4fe7
    output: account
  change-email:
    fingerprint: sha256:f15cf3c5dde96d35
    output: account
  delete-account:
    fingerprint: sha256:d42e50d8a264dff5
    output: account
  late-parcel:
    fingerprint: sha256:ca5cf5fb90d5d426
    output: shipping
  wrong-address:
    fingerprint: sha256:074c9c4d8eed98ed
